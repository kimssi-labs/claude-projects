[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-projects"
version = "1.11.0"
description = "Keyboard manager for Claude Code projects and sessions"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["claude", "claude-code", "tui", "sessions", "windows"]
classifiers = [
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = []                      # standard library only

[project.urls]
Homepage = "https://github.com/kimssi-labs/claude-projects"

[project.scripts]
claude-projects = "claude_projects:main"

[tool.setuptools]
py-modules = ["claude_projects"]
