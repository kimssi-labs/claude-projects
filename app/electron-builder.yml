appId: dev.kimssilabs.hangar
productName: Hangar
copyright: Copyright (c) 2026 kimssi-labs. MIT License.
# The release job uploads the artifacts, not electron-builder — but the provider has to be named
# anyway: it is what makes the build write latest.yml / latest-linux.yml beside the installers, and
# without those files an installed copy has no way to discover that a newer one exists.
publish:
  provider: github
  owner: kimssi-labs
  repo: hangar
directories:
  output: release
  buildResources: build
# Only what the app runs: the TypeScript sources and the tests stay out of the package.
files:
  - dist/**
  - package.json
  - "!**/*.map"
extraMetadata:
  main: dist/main/main.js
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false        # the Start entry is enough; a desktop icon is clutter
  createStartMenuShortcut: true          # the Start entry is what Windows pins to the taskbar from
  shortcutName: Hangar
  # No spaces in the name, or nothing can update. electron-builder's default is "Hangar Setup
  # 2.9.0.exe"; it writes a space-to-dash form of that into latest.yml, while GitHub's upload turns
  # the spaces into dots. Three different names, and the updater fetches the one that 404s. With no
  # space to substitute, both rewrites become no-ops and the three finally agree.
  artifactName: ${productName}-Setup-${version}.${ext}
portable:
  artifactName: ${productName}-${version}.${ext}
linux:
  maintainer: kimssi-labs <kimssi-labs@users.noreply.github.com>
  icon: build/icon.png
  category: Development
  target:
    - AppImage
    - deb
  desktop:
    entry:
      Name: Hangar
      Comment: Session manager for Claude Code
      Keywords: claude;ai;sessions;projects;
