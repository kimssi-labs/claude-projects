<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:" />
    <title>Hangar</title>
    <style>
      /* Everything is inline on purpose: this page has to paint before the app's bundle loads. */
      :root {
        --surface: 250 249 247;
        --panel: 255 255 255;
        --line: 214 211 202;
        --text: 28 27 26;
        --muted: 107 104 98;
        --accent: 217 119 87;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --surface: 20 20 19;
          --panel: 28 27 26;
          --line: 61 59 56;
          --text: 236 234 228;
          --muted: 143 139 129;
        }
      }
      html[data-theme="dark"] {
        --surface: 20 20 19;
        --panel: 28 27 26;
        --line: 61 59 56;
        --text: 236 234 228;
        --muted: 143 139 129;
      }
      html, body { height: 100%; margin: 0; }
      body {
        -webkit-app-region: drag;                    /* it is a window with no frame */
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 20px;
        box-sizing: border-box;
        background: rgb(var(--panel));
        color: rgb(var(--text));
        border: 1px solid rgb(var(--line));
        border-radius: 12px;
        font: 13px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif;
        user-select: none;
        overflow: hidden;
      }
      .mark { width: 44px; height: 44px; flex: none; }
      .text { min-width: 0; }
      .name { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .step {
        color: rgb(var(--muted));
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
      }
      .track {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 3px;
        background: rgb(var(--line) / 0.5);
        overflow: hidden;
      }
      /* Indeterminate on purpose: the steps are named, but their durations are not knowable. */
      .track::after {
        content: "";
        position: absolute;
        top: 0; bottom: 0;
        width: 40%;
        background: rgb(var(--accent));
        animation: sweep 1.1s ease-in-out infinite;
      }
      @keyframes sweep {
        0%   { left: -40%; }
        100% { left: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        .track::after { animation: none; left: 0; width: 100%; opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <svg class="mark" viewBox="0 0 512 512" aria-hidden="true">
      <rect x="16" y="50" width="210" height="98" rx="20" fill="#d97757" />
      <rect x="16" y="104" width="480" height="392" rx="38" fill="#e99c81" />
      <rect x="68" y="180" width="290" height="42" rx="21" fill="#faf9f7" />
      <rect x="68" y="268" width="376" height="42" rx="21" fill="#faf9f7" opacity="0.7" />
      <rect x="68" y="356" width="376" height="42" rx="21" fill="#faf9f7" opacity="0.7" />
      <circle cx="413" cy="201" r="31" fill="#4ac878" />
    </svg>
    <div class="text">
      <div class="name">Hangar</div>
      <div class="step" id="step">Starting…</div>
    </div>
    <div class="track"></div>
  </body>
</html>
