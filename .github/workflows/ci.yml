name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed only by the publish job

defaults:
  run:
    working-directory: app

jobs:
  test:
    # The app ships for both, and the parts that differ most (docking, terminal launch) are the
    # parts worth testing on both.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Electron needs a display. Windows has one; the Linux runner does not.
      - name: End-to-end (Windows)
        if: runner.os == 'Windows'
        run: npx playwright test
      - name: End-to-end (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          [ "$tagged" = "$declared" ] || { echo "tag $GITHUB_REF_NAME != package.json $declared"; exit 1; }
      - name: Changelog has a section for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        run: python tools/release_notes.py "${{ github.ref_name }}"

  package:
    # Installers are built where they run: electron-builder cannot cross-build these targets.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # electron-builder packages dist/, it does not create it.
      - run: npm run build
      # No GH_TOKEN here on purpose: with one in the environment electron-builder starts resolving
      # a publish provider even under --publish never, and fails on a null one.
      - name: Build installers
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            app/release/*.exe
            app/release/*.AppImage
            app/release/*.deb
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        working-directory: .
        run: python tools/release_notes.py "${{ github.ref_name }}" > notes.md
      # Re-tagging is normal here — a tag gets moved when a release needs one more fix — and
      # `gh release create` refuses a tag that already has a release. Update that release instead.
      - name: Publish
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" artifacts/* --title "$TAG" --notes-file notes.md
          fi
