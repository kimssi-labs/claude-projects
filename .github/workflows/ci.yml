name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read by default, so a run that only builds and tests cannot write anything. The publish job asks
# for write on its own; nothing else in this file needs it.
permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  test:
    # The app ships for both, and the parts that differ most (docking, terminal launch) are the
    # parts worth testing on both.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Electron needs a display. Windows has one; the Linux runner does not.
      - name: End-to-end (Windows)
        if: runner.os == 'Windows'
        run: npx playwright test
      - name: End-to-end (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx playwright test
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          [ "$tagged" = "$declared" ] || { echo "tag $GITHUB_REF_NAME != package.json $declared"; exit 1; }
      - name: Changelog has a section for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        # Through the environment, not pasted into the script: a tag name is text someone chose, and
        # `${{ }}` splices it into the shell before the shell ever sees a quote.
        env:
          TAG: ${{ github.ref_name }}
        run: python tools/release_notes.py "$TAG"

  package:
    # Installers are built where they run: electron-builder cannot cross-build these targets.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # electron-builder packages dist/, it does not create it.
      - run: npm run build
      # Still no GH_TOKEN: --publish never means this build uploads nothing, and the release job
      # owns that step. The provider in electron-builder.yml is there for the metadata it makes,
      # not to publish from here.
      - name: Build installers
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}
          path: |
            app/release/*.exe
            app/release/*.AppImage
            app/release/*.deb
            app/release/latest*.yml
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write        # gh release create / upload / edit
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        working-directory: .
        run: python tools/release_notes.py "$TAG" > notes.md
      # Re-tagging is normal here — a tag gets moved when a release needs one more fix — and
      # `gh release create` refuses a tag that already has a release. Update that release instead.
      - name: Publish
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" artifacts/* --title "$TAG" --notes-file notes.md
          fi
      # Every url in latest*.yml has to be a name GitHub actually hosts. For three releases it was
      # not: electron-builder wrote a dashed name, GitHub stored a dotted one, and every update
      # check 404'd without a word. Checked here, against the assets as uploaded, because the
      # renaming happens on upload — there is nothing to compare before that.
      - name: Update metadata names real assets
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          missing=0
          for meta in artifacts/latest*.yml; do
            for url in $(sed -n 's/^ *url: *//p' "$meta"); do
              grep -qxF "$url" <<< "$assets" \
                || { echo "::error::$meta names '$url', which was not uploaded"; missing=1; }
            done
          done
          [ "$missing" = 0 ]
