name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed only by the release job

jobs:
  test:
    # Windows-only tool (console input records, AppBar docking), so it is tested where it runs.
    runs-on: windows-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q claude_projects.py
      - name: Self-test
        run: python claude_projects.py --self-test
      - name: Changelog has a section for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/release_notes.py "$env:GITHUB_REF_NAME"
      - name: Tag matches __version__ and pyproject
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/version_info.py --check "$env:GITHUB_REF_NAME"
      - name: Smoke test (--list against an empty home)
        run: |
          New-Item -ItemType Directory -Force -Path empty-home\projects, empty-home\sessions | Out-Null
          python claude_projects.py --home empty-home --list

  release:
    # Tag a commit (`git tag v1.0.0 && git push --tags`) to publish the standalone exe.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build single-file exe
        run: |
          pip install pyinstaller
          python tools/version_info.py build/version_info.txt
          pyinstaller --onefile --console --name ClaudeProjects --icon assets/icon.ico `
                      --version-file build/version_info.txt claude_projects.py
      - name: Verify the exe runs and is stamped
        run: |
          dist\ClaudeProjects.exe --self-test
          $info = (Get-Item dist\ClaudeProjects.exe).VersionInfo
          $info | Format-List CompanyName, FileVersion, ProductVersion, LegalCopyright
          if ($info.FileVersion -ne $env:GITHUB_REF_NAME.TrimStart('v')) { throw 'exe version resource does not match the tag' }
      - name: Release notes from CHANGELOG.md
        run: python tools/release_notes.py "$env:GITHUB_REF_NAME" | Out-File -FilePath notes.md -Encoding utf8
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist\ClaudeProjects.exe --notes-file notes.md --title "$env:GITHUB_REF_NAME"
